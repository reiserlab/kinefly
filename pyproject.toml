[project]
name = "kinefly"
version = "2.0.0a1"
description = "Real-time kinematic tracking of tethered winged insects"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "numpy",
    "opencv-python",
    "PySide6",
    "pyyaml",
]

[project.optional-dependencies]
harvester = ["harvesters", "genicam!=1.5.1"]
phidgets = ["Phidget22"]
ledpanels = ["pyserial"]
zmq = ["pyzmq", "msgpack"]
plotting = ["matplotlib", "pyzmq", "msgpack"]
all = ["kinefly[harvester,phidgets,ledpanels,zmq,plotting]"]
dev = ["kinefly[all]", "ruff", "pytest"]

[project.scripts]
kinefly = "kinefly.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinefly"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: exact comparison with the standalone 2016-port Kinefly on real video (~30 s; deselect with -m 'not oracle')",
]
