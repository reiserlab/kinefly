kinefly:
  version: 2

camera:
  source: harvester
  device_index: 0
  framerate: 30
  scale_image: 1.0
  cti_file: "/Applications/pylon Viewer.app/Contents/Frameworks/pylon.framework/Versions/A/Libraries/gentlproducer/gtl/ProducerGEV.cti"  # Path to GenTL producer CTI file (required for harvester)

tracking:
  n_edges_max: 1
  rc_background: 1000.0
  use_gui: true

  head:
    tracker: area
    autozero: true
    threshold: 0.0
    feathering: 0.0
    saturation_correction: false

  abdomen:
    tracker: tip
    autozero: true
    threshold: 0.0
    feathering: 0.25
    saturation_correction: false

  left:
    tracker: edge
    autozero: true
    threshold: 0.01
    feathering: 0.25
    saturation_correction: false

  right:
    tracker: edge
    autozero: true
    threshold: 0.01
    feathering: 0.25
    saturation_correction: false

  aux:
    wingbeat_min: 180.0
    wingbeat_max: 220.0

recording:
  output_dir: ~/kinefly_recordings
  encoder: auto

gui:
  state_file: ~/kinefly.yaml
  background_file: ~/kinefly.png  # "Save BG" writes it; loaded at startup

# Uncomment to enable ZeroMQ publishing:
# zmq:
#   address: tcp://*:5555
